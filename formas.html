<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

    body{
        display: flex;

        height: 100vh;
    }

    div{
        width:100px;
        height:100px;
        background-color:blueviolet;
    }
    .roxo{
        background-color:darkorchid;
        margin-left: 0px;
        position:absolute;
        top: 0px;
        left: 0px;
    

    }
    .magenta{
        background-color: darkmagenta;
        position:absolute;
        bottom:50vh;
        left: 100vh;
        
    }
    .lilas{
        background-color: plum;
        margin-left: 0px;
        position: absolute;
        bottom: 0px;
        right: 0px;
    }
  

</style>
  </head>
<body>
    <div class="roxo"></div>
    <div class="magenta"></div>
    <div class="lilas"></div>
</body>
</html>
